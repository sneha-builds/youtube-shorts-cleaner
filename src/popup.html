<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>YouTube Shorts Cleaner</h1>
    <p class="sub">Deletes watched Shorts from your history by date range.</p>

    <ol class="steps">
      <li>Click the button to open your YouTube History page.</li>
      <li>Pick a date range on the panel that appears.</li>
      <li>Confirm the count — we'll delete them for you.</li>
    </ol>

    <button id="open-history" class="btn">Open YouTube History</button>

    <p class="note">Make sure you're signed into YouTube in this browser.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
